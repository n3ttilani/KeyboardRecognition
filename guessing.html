<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Identity Scanner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; overflow: hidden; }
    #recognition-screen { background: #2a2a2a; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 450px; display: flex; flex-direction: column; align-items: center; position: relative; }
    #identity-display { font-size: 32px; color: #2ecc71; margin: 10px 0 20px 0; font-weight: bold; min-height: 40px; }
    #confidence-bar { width: 100%; background: #3d3d3d; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
    #confidence-fill { width: 0%; height: 100%; background: #2ecc71; transition: 0.4s ease; }
    textarea { width: 90%; height: 120px; background: #3d3d3d; border: none; border-radius: 8px; color: white; padding: 15px; font-size: 18px; resize: none; outline: none; margin-bottom: 20px; }
    
    .check-btn { background: transparent; color: #2ecc71; border: 2px solid #2ecc71; padding: 12px 24px; border-radius: 30px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 16px; }
    .check-btn.certain { background: #2ecc71; color: white; }
    
    .fingerprint-icon { font-size: 70px; color: #2ecc71; margin-bottom: 10px; }
    #status-text { color: #666; font-size: 14px; margin-top: 15px; }

    /* Modal Warning Window */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    #modal { background: #333; padding: 30px; border-radius: 16px; text-align: center; width: 320px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); border: 1px solid #444; }
    #modal h3 { margin-top: 0; color: #f39c12; }
    #modal p { color: #ccc; line-height: 1.5; }
    .modal-btns { display: flex; gap: 15px; justify-content: center; margin-top: 25px; }
    .modal-btn { padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-yes { background: #2ecc71; color: white; }
    .btn-yes:hover { background: #27ae60; }
    .btn-no { background: #444; color: white; }
    .btn-no:hover { background: #555; }
  </style>
</head>
<body>

<div id="recognition-screen">
  <div class="fingerprint-icon"><i class="fas fa-fingerprint"></i></div>
  <h2 id="identity-display">Scanning...</h2>
  <div id="confidence-bar"><div id="confidence-fill"></div></div>
  <textarea id="typingArea" placeholder="Start typing..."></textarea>
  <button id="checkBtn" class="check-btn" onclick="handleCheckClick()">Check Now</button>
  <p id="status-text">Gathering data...</p>
</div>

<div id="modal-overlay">
  <div id="modal">
    <i class="fas fa-triangle-exclamation" style="font-size: 40px; color: #f39c12; margin-bottom: 15px;"></i>
    <h3>Not enough data</h3>
    <p>There is still not enough data for a certain match. Do you wish to continue anyway?</p>
    <div class="modal-btns">
      <button class="modal-btn btn-yes" onclick="confirmCheck()">Yes</button>
      <button class="modal-btn btn-no" onclick="closeModal()">No</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp-K4PE_GhabxuoZN052PghmVkbz8tT_Q",
    authDomain: "keyboard-recognition.firebaseapp.com",
    projectId: "keyboard-recognition",
    storageBucket: "keyboard-recognition.firebasestorage.app",
    messagingSenderId: "34676587550",
    appId: "1:34676587550:web:162c8e02d08393188cc20f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let profiles = [], scores = {}, pressed = {}, lastReleased = { key: null, time: null }, eventCount = 0;
  let isCertain = false;

  const loadProfiles = async () => {
    const querySnapshot = await getDocs(collection(db, "users"));
    querySnapshot.forEach((doc) => {
      const d = doc.data();
      profiles.push({ name: doc.id, hold: d.hold, holdSD: d.holdSD, flight: JSON.parse(d.flight), flightSD: JSON.parse(d.flightSD) });
      scores[doc.id] = 0;
    });
    document.getElementById("status-text").textContent = `${profiles.length} profiles loaded.`;
  };

  const getLogLikelihood = (x, mean, sd) => {
    const floorSD = Math.max(sd, 0.005);
    return -Math.log(floorSD * Math.sqrt(2 * Math.PI)) + (-0.5 * Math.pow((x - mean) / floorSD, 2));
  };

  const processEvent = (metric, i, j, val) => {
    eventCount++;
    profiles.forEach(p => {
      let mean = metric === 'hold' ? p.hold[i] : p.flight[i][j];
      let sd = metric === 'hold' ? p.holdSD[i] : p.flightSD[i][j];
      if (mean > 0) scores[p.name] += getLogLikelihood(val, mean, sd);
    });
    updateUI();
  };

  const updateUI = () => {
    if (profiles.length === 0) return;
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const gap = sorted.length > 1 ? sorted[0][1] - sorted[1][1] : 0;
    const confidence = Math.min(100, (gap / 20) * 100); // 20 is threshold for certainty
    
    document.getElementById("confidence-fill").style.width = confidence + "%";
    document.getElementById("status-text").textContent = `Events: ${eventCount}`;

    if (confidence >= 100) {
        isCertain = true;
        document.getElementById("checkBtn").classList.add("certain");
        document.getElementById("identity-display").textContent = sorted[0][0];
    }
  };

  window.handleCheckClick = () => {
    if (isCertain) {
        confirmCheck(); // Just run it if we already know
    } else {
        document.getElementById("modal-overlay").style.display = "flex";
    }
  };

  window.confirmCheck = () => {
    if (profiles.length === 0) return;
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    if (sorted.length > 0) {
        document.getElementById("identity-display").textContent = sorted[0][0];
    }
    closeModal();
  };

  window.closeModal = () => document.getElementById("modal-overlay").style.display = "none";

  const area = document.getElementById("typingArea");
  area.addEventListener("keydown", (e) => {
    if (!e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    const now = Date.now() / 1000;
    if (lastReleased.key !== null) processEvent('flight', lastReleased.key, i, now - lastReleased.time);
    pressed[i] = now;
  });

  area.addEventListener("keyup", (e) => {
    if (!e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    const now = Date.now() / 1000;
    if (pressed[i]) {
      processEvent('hold', i, null, now - pressed[i]);
      lastReleased = { key: i, time: now };
      delete pressed[i];
    }
  });

  loadProfiles();
</script>
</body>
</html>
