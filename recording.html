<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keyboard Rhythm Recorder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; }
    #login-screen, #recording-screen { background: #2a2a2a; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 15px; width: 350px; }
    #recording-screen { display: none; }
    input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 80%; background: #3d3d3d; color: white; outline: none; }
    .start-btn { background-color: #27ae60; color: white; font-size: 20px; cursor: pointer; transition: 0.3s; width: 60px; height: 60px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; }
    .start-btn:hover { background-color: #2ecc71; transform: scale(1.1); }
    .mic-icon { font-size: 80px; color: #e74c3c; animation: pulse-mic 1.5s infinite; margin: 20px 0; }
    @keyframes pulse-mic { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    .controls { display: flex; gap: 20px; margin-top: 20px; }
    .control-btn { font-size: 20px; width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; color: white; }
    .stop-btn { background-color: #c0392b; }
    .pause-btn { background-color: #f39c12; }
    .delete-btn { background-color: #7f8c8d; }
    #status-text { color: #aaa; font-size: 14px; min-height: 40px; }
  </style>
</head>
<body>

<div id="login-screen">
  <h2>Start Recording</h2>
  <input id="nameInput" type="text" placeholder="Enter name..." onkeydown="if(event.key==='Enter') startRecording()">
  <button class="start-btn" onclick="startRecording()" title="Start"><i class="fas fa-play"></i></button>
</div>

<div id="recording-screen">
  <h2 id="welcome-msg"></h2>
  <div class="mic-icon"><i class="fas fa-keyboard"></i></div>
  <p id="status-text">Recording your typing rhythm...<br>You can type anywhere on your computer.</p>
  <div class="controls">
    <button class="control-btn delete-btn" onclick="deleteRecording()" title="Discard Session"><i class="fas fa-trash-can"></i></button>
    <button class="control-btn pause-btn" onclick="togglePause()" id="pauseBtn" title="Pause"><i class="fas fa-pause" id="pauseIcon"></i></button>
    <button class="control-btn stop-btn" onclick="stopAndSave()" title="Save & Exit"><i class="fas fa-stop"></i></button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp-K4PE_GhabxuoZN052PghmVkbz8tT_Q",
    authDomain: "keyboard-recognition.firebaseapp.com",
    projectId: "keyboard-recognition",
    storageBucket: "keyboard-recognition.firebasestorage.app",
    messagingSenderId: "34676587550",
    appId: "1:34676587550:web:162c8e02d08393188cc20f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  class Stats {
    constructor() { this.reset(); }
    reset() {
      this.hold = new Array(26).fill(0); 
      this.holdM2 = new Array(26).fill(0);
      this.holdCount = new Array(26).fill(0);
      
      this.flight = Array.from({length:26}, () => new Array(26).fill(0));
      this.flightM2 = Array.from({length:26}, () => new Array(26).fill(0));
      this.flightCount = Array.from({length:26}, () => new Array(26).fill(0));
      
      this.released = { key: null, time: null };
      this.pressed = {}; 
      this.active = false; 
      this.paused = false;
    }
    load(d) {
      if(d.hold) this.hold = d.hold; 
      if(d.holdM2) this.holdM2 = d.holdM2;
      if(d.holdCount) this.holdCount = d.holdCount;
      if(d.flight) this.flight = JSON.parse(d.flight); 
      if(d.flightM2) this.flightM2 = JSON.parse(d.flightM2);
      if(d.flightCount) this.flightCount = JSON.parse(d.flightCount);
    }
  }

  const s = new Stats();
  let user = "";

  const updateWelford = (avgArr, m2Arr, countArr, i, val, j = null) => {
    let oldAvg, oldM2, n;
    if (j !== null) {
      oldAvg = avgArr[i][j];
      oldM2 = m2Arr[i][j];
      n = ++countArr[i][j];
    } else {
      oldAvg = avgArr[i];
      oldM2 = m2Arr[i];
      n = ++countArr[i];
    }

    const delta = val - oldAvg;
    const newAvg = oldAvg + delta / n;
    const delta2 = val - newAvg;
    const newM2 = oldM2 + delta * delta2;

    if (j !== null) {
      avgArr[i][j] = newAvg;
      m2Arr[i][j] = newM2;
    } else {
      avgArr[i] = newAvg;
      m2Arr[i] = newM2;
    }
  };

  const handlePress = (i, now) => {
    if (s.released.key !== null && s.released.time !== null) {
      updateWelford(s.flight, s.flightM2, s.flightCount, s.released.key, now - s.released.time, i);
    }
    s.pressed[i] = now;
  };

  const handleRelease = (i, now) => {
    if (!s.pressed[i]) return;
    Object.keys(s.pressed).forEach(pKeyStr => {
      const pKey = parseInt(pKeyStr);
      if (pKey !== i) updateWelford(s.flight, s.flightM2, s.flightCount, pKey, s.pressed[pKey] - now, i);
    });
    updateWelford(s.hold, s.holdM2, s.holdCount, i, now - s.pressed[i]);
    s.released = { key: i, time: now };
    delete s.pressed[i];
  };

  window.startRecording = async () => {
    user = document.getElementById("nameInput").value.trim();
    if (!user) return;
    s.reset();
    const snap = await getDoc(doc(db, "users", user));
    if (snap.exists()) s.load(snap.data());
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("recording-screen").style.display = "flex";
    document.getElementById("welcome-msg").textContent = user;
    s.active = true;
  };

  window.addEventListener("keydown", (e) => {
    if (!s.active || s.paused || !e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    const now = Date.now() / 1000;
    if (e.repeat) handleRelease(i, now);
    handlePress(i, now);
  });

  window.addEventListener("keyup", (e) => {
    if (!s.active || s.paused || !e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    handleRelease(i, Date.now() / 1000);
  });

  window.togglePause = () => {
    s.paused = !s.paused;
    document.getElementById("pauseIcon").className = s.paused ? "fas fa-play" : "fas fa-pause";
    document.getElementById("status-text").innerHTML = s.paused ? "Recording Paused" : "Recording your typing rhythm...";
  };

  window.deleteRecording = () => {
    if(!confirm("Discard only current session?")) return;
    s.reset(); location.reload();
  };

  window.stopAndSave = async () => {
    s.active = false;
    document.getElementById("status-text").textContent = "Saving...";

    // Calculate actual Standard Deviations for the DB record
    const holdSD = s.holdM2.map((m2, i) => s.holdCount[i] > 1 ? Math.sqrt(m2 / s.holdCount[i]) : 0);
    const flightSD = s.flightM2.map((row, i) => row.map((m2, j) => s.flightCount[i][j] > 1 ? Math.sqrt(m2 / s.flightCount[i][j]) : 0));

    await setDoc(doc(db, "users", user), {
      hold: s.hold, holdCount: s.holdCount, holdM2: s.holdM2, holdSD: holdSD,
      flight: JSON.stringify(s.flight), flightCount: JSON.stringify(s.flightCount), 
      flightM2: JSON.stringify(s.flightM2), flightSD: JSON.stringify(flightSD),
      lastUpdated: Date.now()
    }, { merge: true });
    location.reload();
  };
</script>
</body>
</html>
