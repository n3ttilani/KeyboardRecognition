<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keyboard Rhythm Recorder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; }
    #login-screen, #recording-screen { background: #2a2a2a; padding: 40px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 15px; width: 350px; }
    #recording-screen { display: none; }
    input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 80%; background: #3d3d3d; color: white; outline: none; }
    .start-btn { background-color: #27ae60; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 12px 25px; border-radius: 8px; border: none; }
    .mic-icon { font-size: 80px; color: #e74c3c; animation: pulse-mic 1.5s infinite; margin: 20px 0; }
    @keyframes pulse-mic { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
    .controls { display: flex; gap: 20px; margin-top: 20px; }
    .control-btn { font-size: 20px; width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; color: white; }
    .stop-btn { background-color: #c0392b; }
    .pause-btn { background-color: #f39c12; }
    .delete-btn { background-color: #7f8c8d; }
    #status-text { color: #aaa; font-size: 14px; min-height: 40px; }
  </style>
</head>
<body>

<div id="login-screen">
  <h2>Start Recording</h2>
  <input id="nameInput" type="text" placeholder="Enter name..." onkeydown="if(event.key==='Enter') startRecording()">
  <button class="start-btn" onclick="startRecording()">GO</button>
</div>

<div id="recording-screen">
  <h2 id="welcome-msg"></h2>
  <div class="mic-icon"><i class="fas fa-microphone"></i></div>
  <p id="status-text">Recording your typing rhythm...<br>You can type anywhere on your computer.</p>
  <div class="controls">
    <button class="control-btn delete-btn" onclick="deleteRecording()" title="Delete"><i class="fas fa-trash-can"></i></button>
    <button class="control-btn pause-btn" onclick="togglePause()" id="pauseBtn" title="Pause"><i class="fas fa-pause" id="pauseIcon"></i></button>
    <button class="control-btn stop-btn" onclick="stopAndSave()" title="Save"><i class="fas fa-stop"></i></button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp-K4PE_GhabxuoZN052PghmVkbz8tT_Q",
    authDomain: "keyboard-recognition.firebaseapp.com",
    projectId: "keyboard-recognition",
    storageBucket: "keyboard-recognition.firebasestorage.app",
    messagingSenderId: "34676587550",
    appId: "1:34676587550:web:162c8e02d08393188cc20f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  class Stats {
    constructor() { this.reset(); }
    reset() {
      this.hold = new Array(26).fill(0); this.holdCount = new Array(26).fill(0);
      this.flight = Array.from({length:26}, () => new Array(26).fill(0));
      this.flightCount = Array.from({length:26}, () => new Array(26).fill(0));
      this.last = null; this.pressed = {}; this.active = false; this.paused = false;
    }
    load(d) {
      if(d.hold) this.hold = d.hold; if(d.holdCount) this.holdCount = d.holdCount;
      if(d.flight) this.flight = JSON.parse(d.flight); if(d.flightCount) this.flightCount = JSON.parse(d.flightCount);
    }
  }

  const s = new Stats();
  let user = "";

  window.startRecording = async () => {
    user = document.getElementById("nameInput").value.trim();
    if (!user) return;
    s.reset();
    const snap = await getDoc(doc(db, "users", user));
    if (snap.exists()) s.load(snap.data());
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("recording-screen").style.display = "flex";
    document.getElementById("welcome-msg").textContent = user;
    s.active = true;
  };

  window.addEventListener("keydown", (e) => {
    if (!s.active || s.paused || !e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    const now = Date.now() / 1000;
    if (s.last) {
      const [li, lt] = s.last; s.flightCount[li][i]++;
      s.flight[li][i] += (now - lt - s.flight[li][i]) / s.flightCount[li][i];
    }
    s.pressed[i] = now; s.last = [i, now];
  });

  window.addEventListener("keyup", (e) => {
    if (!s.active || s.paused || !e.key.match(/^[a-zA-Z]$/)) return;
    const i = e.key.toLowerCase().charCodeAt(0) - 97;
    if (s.pressed[i]) {
      s.holdCount[i]++;
      s.hold[i] += (Date.now()/1000 - s.pressed[i] - s.hold[i]) / s.holdCount[i];
      delete s.pressed[i];
    }
  });

  window.togglePause = () => {
    s.paused = !s.paused;
    const icon = document.getElementById("pauseIcon");
    icon.className = s.paused ? "fas fa-play" : "fas fa-pause";
    document.querySelector(".mic-icon").style.animationPlayState = s.paused ? 'paused' : 'running';
    document.getElementById("status-text").innerHTML = s.paused ? "Recording Paused" : "Recording your typing rhythm...";
  };

  window.deleteRecording = async () => {
    if(!confirm("Delete all data for this user?")) return;
    await deleteDoc(doc(db, "users", user));
    location.reload();
  };

  window.stopAndSave = async () => {
    s.active = false;
    document.getElementById("status-text").textContent = "Saving...";
    await setDoc(doc(db, "users", user), {
      hold: s.hold, holdCount: s.holdCount,
      flight: JSON.stringify(s.flight), flightCount: JSON.stringify(s.flightCount),
      lastUpdated: Date.now()
    }, { merge: true });
    location.reload();
  };
</script>
</body>
</html>
