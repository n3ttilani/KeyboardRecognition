<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keyboard Recognition</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center; /* center vertically */
      align-items: center;     /* center horizontally */
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .editable-box {
      width: 400px;
      height: 200px;
      border: 2px solid #4a90e2;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      outline: none;
    }

    .editable-box:focus {
      border-color: #007bff;
    }
  </style>
</head>
<body>

  <h1>Keyboard Recognition</h1>

  <!-- Single editable div -->
  <div class="editable-box" contenteditable="true">
    Type here...
  </div>

</body>
</html>
