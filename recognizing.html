<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keyboard Recognition</title>

<style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f0f2f5;
}

/* login card */
#login {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  text-align: center;
}

/* name input */
input {
  width: 220px;
  padding: 10px;
  font-size: 16px;
  border: 2px solid #4a90e2;
  border-radius: 8px;
  outline: none;
  margin-right: 10px;
}

input:focus {
  border-color: #007bff;
}

/* button */
button {
  padding: 10px 18px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background-color: #4a90e2;
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: #007bff;
}

/* typing box */
textarea {
  width: 400px;
  height: 200px;
  font-size: 16px;
  padding: 10px;
  border: 2px solid #4a90e2;
  border-radius: 10px;
  outline: none;
  resize: none;
}

textarea:focus {
  border-color: #007bff;
}

#typing {
  text-align: center;
}
</style>
</head>

<body>

<!-- Name input -->
<div id="login">
  <p>Enter your name:</p>
  <input id="nameInput" type="text">
  <button onclick="start()">Go</button>
</div>

<!-- Typing box -->
<div id="typing" style="display:none;">
  <p id="welcome"></p>
  <textarea id="box" placeholder="Type here..."></textarea>
</div>

<script>

let currentUser = null;

function start() {

  const name = document.getElementById("nameInput").value;

  if (name === "") return;

  currentUser = name;

  document.getElementById("login").style.display = "none";
  document.getElementById("typing").style.display = "block";

  document.getElementById("welcome").textContent =
    "Hello " + name + ", start typing:";
}

</script>

</body>
</html>
