<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keyboard Recognition</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }

    textarea {
      width: 400px;
      height: 200px;
      font-size: 16px;
      padding: 10px;
      border: 2px solid #4a90e2;
      border-radius: 10px;
      outline: none;
      resize: none;
    }

    textarea:focus {
      border-color: #007bff;
    }
  </style>
</head>

<body>

<!-- Name input -->
<div id="login">
  <p>Enter your name:</p>
  <input id="nameInput" type="text">
  <button onclick="start()">Go</button>
</div>

<!-- Typing box (hidden at start) -->
<div id="typing" style="display:none;">
  <p id="welcome"></p>
  <textarea id="box" placeholder="Type here..." style="width:400px;height:200px;"></textarea>
</div>

<script>

let currentUser = null;

function start() {

  const name = document.getElementById("nameInput").value;

  if (name === "") return;

  currentUser = name;

  // hide login
  document.getElementById("login").style.display = "none";

  // show typing box
  document.getElementById("typing").style.display = "block";

  // optional welcome text
  document.getElementById("welcome").textContent =
    "Hello " + name + ", start typing:";
}

</script>

</body>
</html>
