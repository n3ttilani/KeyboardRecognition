<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Keyboard Recognition</title>
  <style>
    body { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; background-color: #f0f2f5; }
    #login, #typing { background: #fff; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input, button, textarea { padding: 10px; font-size: 16px; border-radius: 8px; outline: none; margin: 10px 0; }
    input { width: 220px; border: 2px solid #4a90e2; }
    button { border: none; background-color: #4a90e2; color: white; cursor: pointer; padding: 10px 20px; transition: background 0.3s; }
    button:hover { background-color: #007bff; }
    textarea { width: 400px; height: 200px; border: 2px solid #4a90e2; resize: none; }
    textarea:focus { border-color: #007bff; }
    #status { font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>

<div id="login">
  <p>Enter your name:</p>
  <input id="nameInput" type="text" placeholder="Your name..." onkeydown="if(event.key==='Enter') start()">
  <button onclick="start()">Go</button>
</div>

<div id="typing" style="display:none;">
  <p id="welcome"></p>
  <textarea id="box" placeholder="Start typing here..."></textarea>
  <br>
  <button id="submitBtn" onclick="finishSession()">Submit Data</button>
  <p id="status"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDp-K4PE_GhabxuoZN052PghmVkbz8tT_Q",
    authDomain: "keyboard-recognition.firebaseapp.com",
    projectId: "keyboard-recognition",
    storageBucket: "keyboard-recognition.firebasestorage.app",
    messagingSenderId: "34676587550",
    appId: "1:34676587550:web:162c8e02d08393188cc20f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  class UserStats {
    constructor() {
      this.hold = new Array(26).fill(0);
      this.holdCount = new Array(26).fill(0);
      this.flight = Array.from({length:26}, () => new Array(26).fill(0));
      this.flightCount = Array.from({length:26}, () => new Array(26).fill(0));
      this.last = null;
      this.pressed = {};
    }

    load(data) {
      if (data.hold) this.hold = data.hold;
      if (data.holdCount) this.holdCount = data.holdCount;
      if (data.flight) this.flight = JSON.parse(data.flight);
      if (data.flightCount) this.flightCount = JSON.parse(data.flightCount);
    }

    pressing(key) {
      if (!key.match(/^[a-zA-Z]$/)) return;
      const idx = key.toLowerCase().charCodeAt(0) - 97;
      const now = Date.now() / 1000;
      if (this.last !== null) {
        const [lastIdx, lastTime] = this.last;
        this.flightCount[lastIdx][idx] += 1;
        const old = this.flight[lastIdx][idx];
        this.flight[lastIdx][idx] += (now - lastTime - old) / this.flightCount[lastIdx][idx];
      }
      this.pressed[idx] = now;
      this.last = [idx, now];
    }

    releasing(key) {
      if (!key.match(/^[a-zA-Z]$/)) return;
      const idx = key.toLowerCase().charCodeAt(0) - 97;
      const now = Date.now() / 1000;
      if (this.pressed[idx] !== undefined) {
        this.holdCount[idx] += 1;
        const old = this.hold[idx];
        this.hold[idx] += (now - this.pressed[idx] - old) / this.holdCount[idx];
        delete this.pressed[idx];
      }
    }
  }

  const userSample = new UserStats();
  let currentUserName = "";

  window.start = async function () {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return;
    currentUserName = name;

    const userDoc = doc(db, "users", currentUserName);
    const docSnap = await getDoc(userDoc);

    if (docSnap.exists()) {
      userSample.load(docSnap.data());
      console.log("Existing user loaded.");
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("typing").style.display = "block";
    document.getElementById("welcome").textContent = `Hello ${name}, start typing:`;
  };

  const box = document.getElementById("box");
  box.addEventListener("keydown", (e) => userSample.pressing(e.key));
  box.addEventListener("keyup", (e) => userSample.releasing(e.key));

  window.finishSession = async function() {
    const status = document.getElementById("status");
    status.style.color = "black";
    status.textContent = "Syncing with database...";
    
    try {
      const userDoc = doc(db, "users", currentUserName);
      await setDoc(userDoc, {
        hold: userSample.hold,
        holdCount: userSample.holdCount,
        flight: JSON.stringify(userSample.flight),
        flightCount: JSON.stringify(userSample.flightCount),
        lastUpdated: Date.now()
      }, { merge: true });

      status.style.color = "green";
      status.textContent = "Data successfully saved!";
    } catch (e) {
      status.style.color = "red";
      status.textContent = "Error saving data. Check console.";
      console.error(e);
    }
  };
</script>

</body>
</html>
