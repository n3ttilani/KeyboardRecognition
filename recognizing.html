<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keyboard Recognition</title>
</head>

<body>

<!-- Name input -->
<div id="login">
  <p>Enter your name:</p>
  <input id="nameInput" type="text">
  <button onclick="start()">Go</button>
</div>

<!-- Typing box (hidden at start) -->
<div id="typing" style="display:none;">
  <p id="welcome"></p>
  <textarea id="box" placeholder="Type here..." style="width:400px;height:200px;"></textarea>
</div>

<script>

let currentUser = null;

function start() {

  const name = document.getElementById("nameInput").value;

  if (name === "") return;

  currentUser = name;

  // hide login
  document.getElementById("login").style.display = "none";

  // show typing box
  document.getElementById("typing").style.display = "block";

  // optional welcome text
  document.getElementById("welcome").textContent =
    "Hello " + name + ", start typing:";
}

</script>

</body>
</html>
