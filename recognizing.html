<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Keyboard Recognition</title>

<style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f0f2f5;
}

/* login card */
#login {
  background: #fff;
  padding: 30px;
  font-size: 20px;
  border-radius: 12px;
  text-align: center;
}

/* name input and button together */
input, button {
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  outline: none;
}

/* input box */
input {
  width: 220px;
  border: 2px solid #4a90e2;
  margin-right: 10px;
}

input:focus {
  border-color: #007bff;
}

/* button */
button {
  border: none;
  background-color: #4a90e2;
  color: white;
  cursor: pointer;
}

button:hover {
  background-color: #007bff;
}

/* typing box */
textarea {
  width: 400px;
  height: 200px;
  font-size: 16px;
  padding: 10px;
  border: 2px solid #4a90e2;
  border-radius: 10px;
  outline: none;
  resize: none;
}

textarea:focus {
  border-color: #007bff;
}

#typing {
  text-align: center;
}
</style>
</head>

<body>

<!-- Name input -->
<div id="login">
  <p>Enter your name:</p>
  <input id="nameInput" type="text" onkeydown="if(event.key==='Enter') start()">
  <button onclick="start()">Go</button>
</div>

<!-- Typing box -->
<div id="typing" style="display:none;">
  <p id="welcome"></p>
  <textarea id="box" placeholder="Type here..."></textarea>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDp-K4PE_GhabxuoZN052PghmVkbz8tT_Q",
  authDomain: "keyboard-recognition.firebaseapp.com",
  projectId: "keyboard-recognition",
  storageBucket: "keyboard-recognition.firebasestorage.app",
  messagingSenderId: "34676587550",
  appId: "1:34676587550:web:162c8e02d08393188cc20f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;

async function saveName(name) {

  await addDoc(collection(db, "users"), {
    name: name,
    timestamp: Date.now()
  });

  console.log("Name saved to Firebase");
}

window.start = async function () {

  const name = document.getElementById("nameInput").value;

  if (name === "") return;

  currentUser = name;

  await saveName(name);

  document.getElementById("login").style.display = "none";
  document.getElementById("typing").style.display = "block";

  document.getElementById("welcome").textContent =
    "Hello " + name + ", start typing:";
};

</script>

</body>
</html>
